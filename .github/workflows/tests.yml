name: Run Java Tests

on: [push] # This is the "Trigger"

jobs:
  test:
    runs-on: ubuntu-latest # The "Runner" (the cloud computer)
    steps:
      - uses: actions/checkout@v4 # Download your code
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Maven Tests
        run: mvn test # This runs your Unit Tests!